name: UCAS 获取每日课表

on:
  workflow_dispatch:

concurrency:
  group: ucas-course-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync branch
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Fetch today's schedule
        env:
          UCAS_USERNAME: ${{ secrets.UCAS_USERNAME }}
          UCAS_PASSWORD: ${{ secrets.UCAS_PASSWORD }}
          UCAS_TIMEZONE: Asia/Shanghai
        run: node scripts/ucas-automation.mjs fetch-schedule

      - name: Commit schedule state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/current.json
          git diff --cached --quiet || git commit -m "chore: update UCAS daily schedule"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Email today's schedule
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT || 465 }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}
        run: python3 scripts/send_mail.py --subject "UCAS 今日课程表" --body .github/mail/schedule.txt
